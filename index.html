<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamesShop</title> <!--Titulo principal-->
    <!--Iconos-->
    <link rel="icon" href="./assets/images/icono.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!--Fuente Montserrat-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <!--Estilos de la pagina-->
    <link rel="stylesheet" href="./css/styles.css">
    <script>
        // Carga inmediata del tema guardado antes de que renderice la página
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
</head>

<body class="pagina-inicio">

    <!-- HEADER -->
    <header class="encabezado">
        <a href="./index.html" class="logo-sitio">
            <img src="./assets/images/icono.png" alt="Logo GamesShop" class="logo-imagen">
        </a>

        <nav class="menu-navegacion">
            <ul class="lista-menu">
                <li><a class="enlace-menu" href="./index.html">Inicio</a></li>
                <li><a class="enlace-menu" href="./pages/catalogo.html">Catálogo</a></li>
                <li><a class="enlace-menu" href="./pages/carrito.html">Carrito</a></li>
                <li><a class="enlace-menu" href="./pages/lista-deseados.html">Lista de deseos</a></li>
                <li><a class="enlace-menu" href="./pages/perfil.html">Perfil</a></li>
            </ul>
        </nav>

        <div class="acciones-encabezado">
            <button type="button" id="boton-tema" aria-label="Cambiar modo Día/Noche"
                title="Cambiar a Modo Día / Modo Noche">
                <i class="fa-solid fa-moon" id="icono-tema"></i>
            </button>
            <button type="button" id="boton-tema-movil" aria-label="Cambiar modo Día/Noche"
                title="Cambiar a Modo Día / Modo Noche">
                <h4>menu</h4>
            </button>
        </div>
    </header>

    <!-- MAIN -->
    <main>
        <section class="banner-inicio">
            <div class="contenido-banner">
                <h2 class="titulo-banner">Conoce nuestro catalogo de juegos</h2>
                <p class="subtitulo-banner">Compra siempre con nosotros</p>
                <div class="acciones-banner">
                    <a href="./pages/catalogo.html" class="boton-banner">Ir al Catálogo</a>
                </div>
            </div>
        </section>
        <!-- carrusel -->
        <section id="carrusel-principal" class="seccion-carrusel-completo">
            <div class="carrusel-items" id="carrusel-items-inicio">
            </div>

            <button type="button" class="btn-carrusel btn-anterior" id="btn-anterior-inicio" aria-label="Anterior">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button type="button" class="btn-carrusel btn-siguiente" id="btn-siguiente-inicio" aria-label="Siguiente">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </section>


    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>Programacion II - Trabajo Practico</p>
    </footer>

    <script src="./js/app.js"></script>
</body>

</html>
