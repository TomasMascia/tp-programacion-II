<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de deseados</title>
    <link rel="icon" href="./assets/images/icono.webp" type="image/webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!--Fuente Montserrat-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script>
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
</head>

<body>
    <!--header-->
    <header class="encabezado">
        <a class="logo-sitio" href="../index.html">
            <img class="logo-imagen" src="../assets/images/icono.webp" alt="Icono de la pagina">
        </a>
        <nav class="menu-navegacion">
            <ul class="lista-menu">
                <li><a class="enlace-menu" href="../index.html">Inicio</a></li>
                <li><a class="enlace-menu" href="./catalogo.html">Catálogo</a></li>
                <li><a class="enlace-menu" href="./carrito.html">Carrito</a></li>
                <li><a class="enlace-menu" href="./lista-deseados.html">Lista de deseados</a></li>
                <li><a class="enlace-menu" href="./perfil.html">Perfil</a></li>
            </ul>
        </nav>
        <div class="acciones-encabezado">
            <!-- computadora -->
            <button type="button" id="boton-tema" aria-label="Cambiar modo Día/Noche"
                title="Cambiar a Modo Día / Modo Noche">
                <i class="fa-solid fa-moon" id="icono-tema"></i>
            </button>

            <!-- movil -->
            <button type="button" id="boton-tema-movil" aria-label="Abrir menu de navegacion" title="Abrir menú">
                <h4>menu</h4>
            </button>
        </div>
    </header>

    <main class="contenedor-principal">

        <div class="controles-deseados">
            <input type="text" class="buscador-deseados" id="buscador-deseados"
                placeholder="Busca dentro de tus deseos..." autocomplete="off" aria-label="Buscar videojuegos">
            <select id="ordenar-deseados" aria-label="Orden">
                <option value="">Ordenar por</option>
                <option value="titulo">Título (A-Z)</option>
                <option value="reciente">reciente</option>
                <option value="antiguo">antiguedad</option>
                <option value="precio-asc">Precio (Menor a Mayor)</option>
                <option value="precio-desc">Precio (Mayor a Menor)</option>
            </select>
        </div>

        <div id="contenedor-deseados"></div>
    </main>
    <div id="contenedor-notificaciones" class="contenedor-notificaciones"></div>

    <!-- footer -->
    <footer class="footer">
        <p>Programacion II - Trabajo Practico</p>
    </footer>
    <script src="../js/app.js"></script>
</body>

</html>
