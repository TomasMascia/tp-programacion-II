<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="icon" href="../assets/images/icono.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Fuente Montserrat -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script>
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
</head>
<body>
    <header class="header_site">
        <div class="div_header_site">
            <a class="logo-sitio" href="../index.html">
                <img class="logo-img" src="../assets/images/icono.png" alt="Icono de la pagina">
            </a>
            <nav class="menu-navegacion">
                <a href="../index.html">Inicio</a>
                <a href="./catalogo.html">Catálogo</a>
                <a href="./carrito.html">Carrito</a>
                <a href="./lista-deseados.html">Lista de deseados</a>
                <a href="./perfil.html">Perfil</a>
            </nav>
            
            <div class="acciones-encabezado">
                <button type="button" id="boton-tema" aria-label="Cambiar modo Día/Noche" title="Cambiar a Modo Día / Modo Noche">
                    <i class="fa-solid fa-moon" id="icono-tema"></i>
                </button>
                <button type="button" id="boton-tema-movil" aria-label="Abrir menu de navegacion" title="Abrir menú">
                    <h4>menu</h4>
                </button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <!-- VISTA 1: Se muestra si NO hay sesión iniciada -->
        <section id="auth-container" class="auth-section">
            <div class="auth-card">
                <!-- Formulario de Login -->
                <div id="login-box">
                    <h1>Iniciar Sesión</h1>
                    <form id="login-form">
                        <div class="form-group">
                            <label for="login-email">Correo electrónico</label>
                            <input type="email" id="login-email" required placeholder="tu_correo@example.com">
                        </div>
                        <div class="form-group">
                            <label for="login-password">Contraseña</label>
                            <div class="password-container">
                                <input type="password" id="login-password" required placeholder="••••••••">
                                <button type="button" class="toggle-password" data-target="login-password">
                                    <i class="fa-solid fa-eye-slash"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary">Entrar</button>
                    </form>
                    <p class="auth-redirect">
                        ¿No tienes cuenta? <a href="#" id="show-register">Regístrate aquí</a>
                    </p>
                </div>

                <!-- Formulario de Registro -->
                <div id="register-box" class="form-hidden">
                    <h1>Crear Cuenta</h1>
                    <form id="register-form">
                        <div class="form-group">
                            <label for="reg-nickname">Nombre de usuario</label>
                            <input type="text" id="reg-nickname" required placeholder="TuApodo">
                        </div>
                        <div class="form-group">
                            <label for="reg-email">Correo electrónico</label>
                            <input type="email" id="reg-email" required placeholder="tu_correo@gmail.com">
                        </div>
                        <div class="form-group">
                            <label for="reg-password">Contraseña</label>
                            <div class="password-container">
                                <input type="password" id="reg-password" required placeholder="••••••••">
                                <button type="button" class="toggle-password" data-target="reg-password">
                                    <i class="fa-solid fa-eye-slash"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary">Registrarse</button>
                    </form>
                    <p class="auth-redirect">
                        ¿Ya tienes una cuenta? <a href="#" id="show-login">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </section>

        <!-- VISTA 2: Se muestra SI hay sesión iniciada -->
        <section id="profile-container" class="auth-section form-hidden">
            <div class="auth-card profile-card-wide">
                <h1>Mi Perfil</h1>
                <form id="profile-form">
                    <div class="form-group">
                        <label for="profile-nickname-input">Nombre de usuario</label>
                        <input type="text" id="profile-nickname-input" disabled required>
                    </div>
                    <div class="form-group">
                        <label for="profile-email-input">Correo electrónico</label>
                        <input type="email" id="profile-email-input" disabled required>
                    </div>

                    <div class="profile-actions">
                        <button type="button" id="btn-edit-profile" class="btn-primary btn-secondary-color">Modificar Datos</button>
                        <button type="submit" id="btn-save-profile" class="btn-primary form-hidden">Guardar Cambios</button>
                    </div>
                </form>

                <!-- Sección para Cambiar Contraseña -->
                <hr class="profile-divider">
                <h3>Cambiar Contraseña</h3>
                <form id="change-password-form" class="profile-subform">
                    <div class="form-group">
                        <label for="current-password">Contraseña actual</label>
                        <div class="password-container">
                            <input type="password" id="current-password" required placeholder="••••••••">
                            <button type="button" class="toggle-password" data-target="current-password">
                                <i class="fa-solid fa-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="new-password">Nueva contraseña</label>
                        <div class="password-container">
                            <input type="password" id="new-password" required placeholder="••••••••">
                            <button type="button" class="toggle-password" data-target="new-password">
                                <i class="fa-solid fa-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary btn-full-width">Actualizar Contraseña</button>
                </form>

                <!-- Sección de Lista de Deseados en el Perfil -->
                <hr class="profile-divider">
                <h3>Mi Lista de Deseados</h3>
                <div id="profile-wishlist-container" class="profile-wishlist-box">
                </div>

                <button id="btn-logout" class="btn-primary btn-danger btn-full-width">Cerrar Sesión</button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>Programacion II - Trabajo Practico</p>
    </footer>
    <script src="../js/app.js"></script>
</body>
</html>
