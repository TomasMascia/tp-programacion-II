<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Iconos-->
    <link rel="icon" href="../assets/images/icono.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Perfil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <script>
        // Carga inmediata del tema guardado antes de que renderice la página
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
</head>

<body>
    <!--HEADER-->
    <header class="header_site">
        <!--Logo de la pagina con boton para volver al inicio-->
        <a class="link_header_site" href="./index.html">
            <img class="img_header_site" src="../assets/images/icono.png" alt="Icono de la pagina">
        </a>

        <!--Menu de navegacion para ir a las otras paginas que la componen-->
        <nav class="nav_header_site">
            <ul class="ul_header_site">
                <li><a class="li_header_site" href="../index.html">Inicio</a></li>
                <li><a class="li_header_site" href="./catalogo.html">Catálogo</a></li>
                <li><a class="li_header_site" href="./carrito.html">Carrito</a></li>
                <li><a class="li_header_site" href="./lista-deseados.html">Lista de deseados</a></li>
                <li><a class="li_header_site" href="./perfil.html">Perfil</a></li>
            </ul>
        </nav>
         <!-- BOTONES DE CONTROL -->
        <div class="div_header_site">
            <!-- COMPUTADORA -->
            <button type="button" id="theme-page" aria-label="Cambiar modo Día/Noche"
                title="Cambiar a Modo Día / Modo Noche">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
            </button>

            <!-- MOVIL -->
            <button type="button" id="theme-page-movil" aria-label="Abrir menu de navegacion" title="Abrir menú">
                <h4>menu</h4>
            </button>
        </div>
    </header>

    <main class="main-container">
        <div class="perfil-hero">
            <h1 class="perfil-nickname"></h1>

            <img class="perfil-hero-image" src="../assets/images/perfil-image-bk.avif" alt="bk-images">
        </div>
    </main>

    <footer>
        <p>footer</p>
    </footer>
    <script src="../js/app.js"></script>
</body>

</html>
