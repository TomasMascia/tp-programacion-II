<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="icon" href="../assets/images/icono.webp" type="image/webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script>
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
</head>

<body>
    <header class="encabezado">
        <a class="logo-sitio" href="../index.html">
            <img class="logo-imagen" src="../assets/images/icono.webp" alt="Icono de la pagina">
        </a>
        <nav class="menu-navegacion">
            <ul class="lista-menu">
                <li><a class="enlace-menu" href="../index.html">Inicio</a></li>
                <li><a class="enlace-menu" href="./catalogo.html">Catálogo</a></li>
                <li><a class="enlace-menu" href="./carrito.html">Carrito</a></li>
                <li><a class="enlace-menu" href="./lista-deseados.html">Lista de deseados</a></li>
                <li><a class="enlace-menu" href="./perfil.html">Perfil</a></li>
            </ul>
        </nav>

        <div class="acciones-encabezado">
            <button type="button" id="boton-tema" aria-label="Cambiar modo Día/Noche"
                title="Cambiar a Modo Día / Modo Noche">
                <i class="fa-solid fa-moon" id="icono-tema"></i>
            </button>
            <button type="button" id="boton-tema-movil" aria-label="Abrir menu de navegacion" title="Abrir menú">
                <h4>menu</h4>
            </button>
        </div>
    </header>

    <main class="contenedor-principal">
        <section id="contenedor-login" class="seccion-login">
            <div class="tarjeta-login">
                <div id="caja-login">
                    <h1>Iniciar Sesión</h1>
                    <form id="formulario-login" novalidate>
                        <div class="grupo-formulario">
                            <label for="correo-login">Correo electrónico</label>
                            <input type="email" id="correo-login" required placeholder="tu_correo@example.com">
                        </div>
                        <div class="grupo-formulario">
                            <label for="contrasena-login">Contraseña</label>
                            <div class="contenedor-contrasena">
                                <input type="password" id="contrasena-login" required placeholder="••••••••">
                                <button type="button" class="boton-ver-contrasena" data-target="contrasena-login">
                                    <i class="fa-solid fa-eye-slash"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="boton-principal">Entrar</button>
                    </form>
                    <p class="texto-cambiar-formulario">
                        ¿No tienes cuenta? <a href="#" id="mostrar-registro">Regístrate aquí</a>
                    </p>
                </div>

                <div id="caja-registro" class="formulario-oculto">
                    <h1>Crear Cuenta</h1>
                    <form id="formulario-registro" novalidate>
                        <div class="grupo-formulario">
                            <label for="registro-nombre">Nombre de usuario</label>
                            <input type="text" id="registro-nombre" required placeholder="TuApodo">
                        </div>
                        <div class="grupo-formulario">
                            <label for="registro-correo">Correo electrónico</label>
                            <input type="email" id="registro-correo" required placeholder="tu_correo@gmail.com">
                        </div>
                        <div class="grupo-formulario">
                            <label for="registro-contrasena">Contraseña</label>
                            <div class="contenedor-contrasena">
                                <input type="password" id="registro-contrasena" required placeholder="••••••••">
                                <button type="button" class="boton-ver-contrasena" data-target="registro-contrasena">
                                    <i class="fa-solid fa-eye-slash"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="boton-principal">Registrarse</button>
                    </form>
                    <p class="texto-cambiar-formulario">
                        ¿Ya tienes una cuenta? <a href="#" id="mostrar-login">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </section>

        <section id="contenedor-perfil" class="seccion-login formulario-oculto">
            <div class="tarjeta-login tarjeta-perfil-ancha">
                <h1>Mi Perfil</h1>
                <form id="formulario-perfil" novalidate>
                    <div class="grupo-formulario">
                        <label for="perfil-nombre-input">Nombre de usuario</label>
                        <input type="text" id="perfil-nombre-input" disabled required>
                    </div>
                    <div class="grupo-formulario">
                        <label for="perfil-correo-input">Correo electrónico</label>
                        <input type="email" id="perfil-correo-input" disabled required>
                    </div>

                    <div class="acciones-perfil">
                        <button type="button" id="boton-editar-perfil" class="boton-principal boton-secundario">Modificar
                            Datos</button>
                        <button type="submit" id="boton-guardar-perfil" class="boton-principal formulario-oculto">Guardar
                            Cambios</button>
                    </div>
                </form>

                <hr class="separador-perfil">
                <h3>Cambiar Contraseña</h3>
                <form id="formulario-cambiar-contrasena" class="subformulario-perfil" novalidate>
                    <div class="grupo-formulario">
                        <label for="contrasena-actual">Contraseña actual</label>
                        <div class="contenedor-contrasena">
                            <input type="password" id="contrasena-actual" required placeholder="••••••••">
                            <button type="button" class="boton-ver-contrasena" data-target="contrasena-actual">
                                <i class="fa-solid fa-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="grupo-formulario">
                        <label for="contrasena-nueva">Nueva contraseña</label>
                        <div class="contenedor-contrasena">
                            <input type="password" id="contrasena-nueva" required placeholder="••••••••">
                            <button type="button" class="boton-ver-contrasena" data-target="contrasena-nueva">
                                <i class="fa-solid fa-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="boton-principal boton-ancho-total">Actualizar Contraseña</button>
                </form>

                <!-- NUEVO BOTÓN DE CERRAR SESIÓN -->
                <div class="acciones-perfil" style="margin-top: 20px;">
                    <button type="button" id="boton-cerrar-sesion" class="boton-principal boton-ancho-total"
                        style="background-color: #d9534f;">Cerrar Sesión</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>Programacion II - Trabajo Practico</p>
    </footer>
    <script src="../js/app.js"></script>
</body>

</html>
