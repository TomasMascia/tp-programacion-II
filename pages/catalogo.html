<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header class="header_site">
        <a class="link_header_site" href="../index.html">
            <img class="img_header_site" src="../assets/images/icono.png" alt="Icono de la pagina">
        </a>

        <nav class="nav_header_site">
            <ul class="ul_header_site">
                <li><a class="li_header_site" href="../index.html">Inicio</a></li>
                <li><a class="li_header_site" href="./catalogo.html">Catálogo</a></li>
                <li><a class="li_header_site" href="./carrito.html">Carrito</a></li>
                <li><a class="li_header_site" href="./lista-deseados.html">Lista de deseados</a></li>
            </ul>
        </nav>

        <div class="div_header_site">
            <a class="profile_header_link" href="./perfil.html">
                <img class="profile_header_avatar" src="../assets/images/perfil.jpg" alt="Foto de perfil">
                <span class="profile_header_name">Tomás Mascia</span>
            </a>
        </div>
    </header>

    <main class="main-container">
        <section class="controls-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Buscar por título o género..." 
                    autocomplete="off"
                    aria-label="Buscar videojuegos"
                >
            </div>
        </section>

        <section id="games-container" class="games-grid" aria-live="polite"></section>

        <div id="no-results" class="no-results hidden">
            <p>No se encontraron juegos que coincidan con tu búsqueda.</p>
        </div>
    </main>

    <footer>
        <p>footer</p>
    </footer>

    <script src="../js/app.js"></script>
</body>

</html>
