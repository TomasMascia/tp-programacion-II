<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Videojuegos - GamesShop</title>

    <!-- ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- ESTILOS -->
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <!-- HEADER -->
    <header class="header_site">
        <!-- LOGO DE LA PAGINA PRINCIPAL -->
        <a class="link_header_site" href="../index.html">
            <img class="img_header_site" src="../assets/images/icono.png" alt="Icono de la pagina">
        </a>

        <!-- MENU DE NAVEGACION -->
        <nav class="nav_header_site">
            <ul class="ul_header_site">
                <li><a class="li_header_site" href="../index.html">Inicio</a></li>
                <li><a class="li_header_site" href="./catalogo.html">Catálogo</a></li>
                <li><a class="li_header_site" href="./carrito.html">Carrito <span id="cart-counter">(0)</span></a></li>
                <li><a class="li_header_site" href="./lista-deseados.html">Lista de deseados</a></li>
                <li><a class="li_header_site" href="./perfil.html">Perfil</a></li>
            </ul>
        </nav>

        <!-- BOTONES DE CONTROL -->
        <div class="div_header_site">
            <!-- COMPUTADORA -->
            <button type="button" id="theme-page" aria-label="Cambiar modo Día/Noche"
                title="Cambiar a Modo Día / Modo Noche">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
            </button>

            <!-- MOVIL -->
            <button type="button" id="theme-page-movil" aria-label="Abrir menu de navegacion" title="Abrir menú">
                <h4>menu</h4>
            </button>
        </div>
    </header>

    <!-- MAIN-CATALOGO -->
    <main class="main-container">

        <!-- BUSCADOR -->
        <section class="controls-section">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Buscar por título o género..." autocomplete="off"
                    aria-label="Buscar videojuegos">
            </div>
        </section>

        <!-- CONTENEDOR DINAMICO CON JS -->
        <section id="games-container"></section>

        <!-- MENSAJE SI NO ENCUENTRA COINCIDENCIA -->
        <div id="no-results" class="no-results hidden">
            <p>No se encontraron juegos que coincidan con tu búsqueda.</p>
        </div>

    </main>

    <!-- NOTIFICACIONES TOAST -->
    <div id="toast-container" class="toast-container"></div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; GamesShop - Trabajo Práctico Programación II</p>
    </footer>

    <!-- SCRIPT -->
    <script src="../js/app.js"></script>
</body>

</html>
