<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/images/icono.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!--Fuente Montserrat-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script>
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
</head>

<body>
    <!-- header -->
    <header class="encabezado">
        <a class="logo-sitio" href="../index.html">
            <img class="logo-imagen" src="../assets/images/icono.png" alt="Icono de la pagina">
        </a>
        <nav class="menu-navegacion">
            <ul class="lista-menu">
                <li><a class="enlace-menu" href="../index.html">Inicio</a></li>
                <li><a class="enlace-menu" href="./catalogo.html">Catálogo</a></li>
                <li><a class="enlace-menu" href="./carrito.html">Carrito</a></li>
                <li><a class="enlace-menu" href="./lista-deseados.html">Lista de deseados</a></li>
            </ul>
        </nav>

        <!-- botones -->
        <div class="acciones-encabezado">
            <button type="button" id="boton-tema" aria-label="Cambiar modo Día/Noche"
                title="Cambiar a Modo Día / Modo Noche">
                <i class="fa-solid fa-moon" id="icono-tema"></i>
            </button>

            <button type="button" id="boton-tema-movil" aria-label="Abrir menu de navegacion" title="Abrir menú">
                <h4>menu</h4>
            </button>
        </div>
    </header>

    <!-- main -->
    <main class="contenedor-principal">

        <section class="seccion-buscador">
            <div class="caja-buscador">
                <input type="text" id="buscador-juegos" placeholder="Buscar por título o género..." autocomplete="off"
                    aria-label="Buscar videojuegos">
            </div>
        </section>
        <section id="contenedor-juegos"></section>
        <!-- no encuentra -->
        <div id="sin-resultados" class="sin-resultados oculto">
            <p>No se encontraron juegos que coincidan con tu búsqueda.</p>
        </div>

    </main>

    <!-- footer -->
    <footer>
        <p>Programacion II - Trabajo Práctico</p>
    </footer>
    <script src="../js/app.js"></script>
</body>

</html>
